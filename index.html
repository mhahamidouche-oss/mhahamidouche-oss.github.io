<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1722">
<title>Analyse discriminante</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discriminante">
<meta name="description" content="Analyse discriminante comme dans SPSS, sur téléphone, tablette et PC, sans Internet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1722'/%3E%3Ccircle cx='22' cy='38' r='9' fill='%23d96e1c'/%3E%3Ccircle cx='42' cy='24' r='9' fill='%23ffffff'/%3E%3Cpath d='M12 52 52 12' stroke='%23ffffff' stroke-width='3'/%3E%3C/svg%3E">
<style id="appcss">
:root{--navy:#0d1722;--ink:#1b2733;--muted:#5b6876;--line:#c9d1da;--bg:#eef2f5;--card:#fff;--or:#d96e1c;--or2:#b85a12;--ok:#2e7d52;--bad:#b5453b;--soft:#f4f7f9}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
html[dir=rtl] body{font-family:Arial,"Segoe UI",Tahoma,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:5}
header .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
header h1{margin:0;font-size:18px;color:var(--or);letter-spacing:.2px}
header p{margin:2px 0 0;font-size:12px;color:#b9c4cf}
.langs{display:flex;border:1px solid #3a4a5c;border-radius:8px;overflow:hidden;flex:none}
.langs button{background:none;border:0;color:#cfd8e1;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.langs button.on{background:var(--or);color:#fff}
main{max-width:880px;margin:0 auto;padding:12px 16px 96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:880px}
nav.tabs button{flex:1;background:none;border:0;padding:8px 4px 9px;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--or2);font-weight:600}
.card{background:var(--card);border:1px solid #dde3e9;border-radius:12px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 10px;font-size:17px;color:var(--navy)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}.row.center{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:40px}
.btn.primary{background:var(--or);border-color:var(--or);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink);font-weight:500}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn.big{min-width:120px;font-size:16px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
.muted{color:var(--muted)}.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.newbox{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;display:grid;gap:8px}
.newbox label{display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select{font:inherit;color:var(--ink)}
.newbox input,.field select,input.num{border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:#fff}
.field select{width:100%;padding:9px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:#fff;border:0;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.grid{border-collapse:collapse;font-size:13px}
table.grid th,table.grid td{border:1px solid var(--line);padding:0}
table.grid thead th{background:var(--navy);color:#fff;padding:6px 8px;white-space:nowrap;font-weight:600;position:sticky;top:0}
table.grid tbody th{background:var(--soft);padding:4px 8px;color:var(--muted);font-weight:500}
table.grid input,table.grid select{border:0;padding:6px 8px;width:7.5em;background:transparent}
table.grid.vars input{width:10em}
table.grid input:focus{outline:2px solid var(--or);background:#fff8f2}
table.grid input.err{background:#fde8e6}
.pager span{font-size:13px;color:var(--muted)}
.dlg .field{margin:0 0 14px}
.dlg .field>label,.dlg .field .row>label:first-child{font-weight:600;display:block;margin-bottom:4px}
.range{flex-wrap:wrap}
.range label{display:flex;align-items:center;gap:6px;font-weight:400!important;margin:0!important}
.tag{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;font-family:ui-monospace,Consolas,monospace}
.vlist{border:1px solid var(--line);border-radius:9px;max-height:260px;overflow:auto;padding:4px 8px}
.ck{display:flex;align-items:flex-start;gap:9px;padding:6px 0;cursor:pointer}
.ck input{width:19px;height:19px;margin:1px 0 0;accent-color:var(--or);flex:none}
.ck.dis{opacity:.45}
.radios{margin-top:6px}
details.sub{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff}
details.sub>summary{padding:11px 12px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary::after{content:"▾";color:var(--muted)}
details.sub[open]>summary::after{content:"▴"}
details.sub.off>summary{color:var(--muted)}
.subin{padding:0 12px 10px}
fieldset{border:1px solid #e3e8ed;border-radius:8px;margin:8px 0;padding:4px 10px 6px}
legend{font-size:13px;color:var(--or2);font-weight:600;padding:0 4px}
.indent{padding-inline-start:28px;flex-wrap:wrap}
.indent label{display:flex;align-items:center;gap:6px}
.indent label.dis{opacity:.45}
.actions{margin-top:14px;flex-wrap:wrap}
pre{background:var(--navy);color:#e6edf3;border-radius:8px;padding:10px;overflow:auto;font-size:12.5px;text-align:left}
.tools .row{margin:4px 0}
.run h2 small{font-weight:400;font-size:13px}
nav.toc{font-size:13px;margin:8px 0 4px;line-height:1.9}
nav.toc a{display:inline-block;margin-inline-end:10px;color:var(--or2);text-decoration:none;border-bottom:1px dotted}
details.syn summary{cursor:pointer;color:var(--muted);font-size:13px}
.part{margin:16px 0 0;scroll-margin-top:80px}
.ttl{font-weight:700;color:var(--navy);margin:0 0 6px;font-size:14.5px}
.ttl.big{font-size:16px;color:var(--or2);margin-top:4px}
.tbl{margin:0 0 12px}
table.t{border-collapse:collapse;font-size:13px;background:#fff}
table.t th,table.t td{border:1px solid #9aa7b4;padding:4px 8px;vertical-align:middle}
table.t thead th{background:#e9eef3;font-weight:600;text-align:center}
table.t th.rh{background:#f6f8fa;font-weight:500;text-align:start;min-width:6em;max-width:15em;overflow-wrap:anywhere}
.m{unicode-bidi:isolate;white-space:nowrap}
details.toc summary{cursor:pointer;color:var(--or2);font-weight:600;font-size:13.5px;margin-top:6px}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
table.t sup{font-size:9px}
.tbl.wide table.t{font-size:12px}
.notes{font-size:12px;color:var(--muted);margin-top:4px;max-width:640px}
.hint{background:#fff6ee;border-inline-start:4px solid var(--or);padding:8px 10px;border-radius:6px;font-size:13.5px;margin:6px 0 12px}
.warn{color:var(--bad);font-weight:600}
.chart{margin:4px 0 12px}
.chart canvas{border:1px solid #dde3e9;border-radius:8px;max-width:100%}
.help h3{color:var(--or2);margin:14px 0 6px;font-size:16px}
.help ol{padding-inline-start:20px}.help li{margin:4px 0}
.help table.t td,.help table.t th{font-size:13px}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:9;max-width:92vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad)}
.vlistp{font-size:13px}
.ready{border:1px dashed var(--or);border-radius:10px;padding:8px 10px;margin:6px 0;background:#fffaf5}
.who label{display:flex;align-items:center;gap:6px;flex:1 1 140px}.who input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:8px}
.report-doc{position:absolute;left:-20000px;top:0;width:760px;background:#fff;padding:8px 14px;color:#1b2733}
.report-doc .run{border:0;padding:0;margin:0}.report-doc .part{margin:10px 0 0}
.rep-head{text-align:center;border-bottom:2px solid #d96e1c;padding:8px 0 10px;margin-bottom:8px}
.rep-head h1{margin:0 0 6px;font-size:22px;color:#0d1722}.rep-head .who{font-weight:700;font-size:16px}.rep-head .meta{color:#5b6876;font-size:13px;margin-top:4px}
body.report main{padding:16px}
body.report .card{break-inside:auto}
@media print{header,nav.tabs,.tools,nav.toc,#toast,details.syn{display:none!important}main{padding:0}.card{border:0;padding:0}.view[hidden]{display:none!important}.part{break-inside:avoid}body{background:#fff}}
@media (max-width:420px){header h1{font-size:16px}.btn{padding:8px 11px}}
</style>
</head>
<body>
<header><div class="in"><div><h1 id="hTitle">Analyse discriminante</h1><p id="hSub"></p></div>
<div class="langs"><button data-l="fr">FR</button><button data-l="ar">ع</button><button data-l="en">EN</button></div></div></header>
<main>
<div class="view" id="view-data"></div>
<div class="view" id="view-analysis" hidden></div>
<div class="view" id="view-output" hidden></div>
<div class="view" id="view-help" hidden></div>
</main>
<nav class="tabs"><div class="in">

<button data-v="output"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span></span></button>

</div></nav>

  const dp = det(pooled), ldp = dp > 0 ? Math.log(dp) : NaN;
  // ligne « intra-groupes combinés » sur tous les groupes
  const pooledAll = W.map(r => r.map(v => v / (n - g)));
  const dpa = det(pooledAll);
  logs.push({ k: 'pooled', rank: rank(pooledAll), logdet: dpa > 0 ? Math.log(dpa) : NaN });
  if (gUsed < 2) return { logs, M: NaN, F: NaN, df1: NaN, df2: NaN, sig: NaN, groupsUsed: gUsed };
  groupsOk.forEach(k => { const ld = logs[k].logdet; M += (nj[k] - 1) * (ldp - ld); s1 += 1 / (nj[k] - 1); s2 += 1 / (nj[k] - 1) ** 2; });
  const N = nUsed - gUsed, G = gUsed;
  const c1 = (s1 - 1 / N) * (2 * p * p + 3 * p - 1) / (6 * (p + 1) * (G - 1));
  const c2 = (s2 - 1 / (N * N)) * (p - 1) * (p + 2) / (6 * (G - 1));
  const df1 = (G - 1) * p * (p + 1) / 2;
  let df2, F;
  if (c2 - c1 * c1 > 0) { df2 = (df1 + 2) / (c2 - c1 * c1); const b = df1 / (1 - c1 - df1 / df2); F = M / b; }
  else { df2 = (df1 + 2) / (c1 * c1 - c2); const b = df2 / (1 - c1 + 2 / df2); F = df2 * M / (df1 * (b - M)); }
  return { logs, M, F, df1, df2, sig: fSig(F, df1, df2), groupsUsed: G, groupsTotal: g };
}

// Probabilités a posteriori dans l'espace des fonctions
function posterior(z, cent, priors, sep) {
  const g = cent.length, m = z.length, d2 = [], lw = [];
  for (let k = 0; k < g; k++) {
    if (sep) {
      const { Ci, ldet } = sep[k];
      const dz = z.map((v, i) => v - cent[k][i]);
      d2[k] = dot(dz, mv(Ci, dz));
      lw[k] = Math.log(priors[k]) - 0.5 * ldet - 0.5 * d2[k];
    } else {
      d2[k] = z.reduce((s, v, i) => s + (v - cent[k][i]) ** 2, 0);
      lw[k] = Math.log(priors[k]) - 0.5 * d2[k];
    }
  }
  const mx = Math.max(...lw), w = lw.map(v => Math.exp(v - mx)), s = w.reduce((a, b) => a + b, 0);
  return { post: w.map(v => v / s), d2 };
}

// ---------- analyse complète ----------
function run(ds, o) {
  const out = { warnings: [], notes: [] };
  const V = ds.vars, nAll = ds.n;
  const gv = V[o.group];
  const ind = o.indep.slice();
  const p0 = ind.length;
  if (!p0) throw new Error('NO_INDEP');
  const lo = +o.min, hi = +o.max;
  const sel = o.selVar != null && o.selVar !== '' ? V[o.selVar] : null;
  // statut de chaque observation
  const cases = [];
  let nMissGroup = 0, nOutRange = 0, nMissX = 0, nBoth = 0, nUnsel = 0;
  for (let r = 0; r < nAll; r++) {
    const gval = gv.values[r];
    const x = ind.map(j => V[j].values[r]);
    const missX = x.some(v => typeof v !== 'number' || !isFinite(v));
    const gMiss = typeof gval !== 'number' || !isFinite(gval);
    const gOut = !gMiss && (gval < lo || gval > hi || gval !== Math.round(gval));
    const selected = !sel || sel.values[r] === +o.selVal;
    cases.push({ r, gval, x, missX, gMiss, gOut, selected });
    if (!selected) { nUnsel++; continue; }
    if ((gMiss || gOut) && missX) nBoth++;
    else if (gMiss || gOut) { if (gMiss) nMissGroup++; else nOutRange++; }
    else if (missX) nMissX++;
  }
  const valid = cases.filter(c => c.selected && !c.gMiss && !c.gOut && !c.missX);
  const levels = [...new Set(valid.map(c => c.gval))].sort((a, b) => a - b);
  const g = levels.length;
  out.casesSummary = { valid: valid.length, missGroup: nMissGroup, outRange: nOutRange, missX: nMissX, both: nBoth, unselected: nUnsel, total: nAll };
  if (g < 2) throw new Error('LT2GROUPS');
  const gi = valid.map(c => levels.indexOf(c.gval));
  const Xfull = valid.map(c => c.x);
  const glab = levels.map(l => (gv.labels && gv.labels[l] != null) ? gv.labels[l] : null);
  out.groups = levels.map((l, k) => ({ value: l, label: glab[k] }));
  out.varNames = ind.map(j => V[j].name);
  const Cfull = core(Xfull, gi, g, p0);
  out.n = Cfull.n; out.g = g; out.nj = Cfull.nj;
  if (Cfull.n - g < 1) throw new Error('DF');
  const sdFull = Cfull.means.map((_, k) => { const S = Cfull.Wg[k]; return S.map((r, i) => Math.sqrt(r[i] / (Cfull.nj[k] - 1))); });

  // statistiques de groupe
  if (o.stats.means) {
    const totSd = Cfull.T.map((r, i) => Math.sqrt(r[i] / (Cfull.n - 1)));
    out.groupStats = { groups: Cfull.means.map((m, k) => ({ mean: m, sd: sdFull[k], n: Cfull.nj[k] })), total: { mean: Cfull.gm, sd: totSd, n: Cfull.n } };
  }
  if (o.stats.anova) {
    out.anova = out.varNames.map((nm, i) => {
      const w = Cfull.W[i][i], t = Cfull.T[i][i], lam = w / t;
      const F = ((t - w) / (g - 1)) / (w / (Cfull.n - g));
      return { name: nm, lambda: lam, F, df1: g - 1, df2: Cfull.n - g, sig: fSig(F, g - 1, Cfull.n - g) };
    });
  }
  const dfw = Cfull.n - g;
  const covW = Cfull.W.map(r => r.map(v => v / dfw));
  const corr = M => M.map((r, i) => r.map((v, j) => v / Math.sqrt(M[i][i] * M[j][j])));
  if (o.stats.wcov || o.stats.wcorr) out.pooled = { cov: o.stats.wcov ? covW : null, corr: o.stats.wcorr ? corr(covW) : null, df: dfw };
  if (o.stats.gcov || o.stats.tcov) out.covs = {
    groups: o.stats.gcov ? Cfull.Wg.map((S, k) => S.map(r => r.map(v => v / (Cfull.nj[k] - 1)))) : null,
    total: o.stats.tcov ? Cfull.T.map(r => r.map(v => v / (Cfull.n - 1))) : null, dfT: Cfull.n - 1
  };

  // ----- méthode pas à pas (lambda de Wilks) -----
  let inModel = ind.map((_, i) => i);
  if (o.method === 'stepwise') {
    const st = stepwise(Cfull, o, out.varNames);
    out.stepwise = st;
    inModel = st.final;
    if (!inModel.length) { out.noVars = true; return out; }
  }
  const p = inModel.length;
  const X = Xfull.map(x => inModel.map(i => x[i]));
  const C = core(X, gi, g, p);
  out.modelVars = inModel.map(i => out.varNames[i]);

  if (o.stats.box) out.box = boxM(C);

  // ----- fonctions canoniques -----
  let can;
  try { can = canonical(C); } catch (e) { throw new Error('SINGULAR_W'); }
  const m = can.m;
  out.m = m;
  out.eigen = can.lambdas.map((l, k) => {
    const tot = can.lambdas.reduce((a, b) => a + b, 0);
    const cum = can.lambdas.slice(0, k + 1).reduce((a, b) => a + b, 0);
    return { lambda: l, pct: 100 * l / tot, cum: 100 * cum / tot, rc: Math.sqrt(l / (1 + l)) };
  });
  out.wilks = can.lambdas.map((_, k) => {
    const L = can.lambdas.slice(k).reduce((a, l) => a / (1 + l), 1);
    const chi = -(C.n - 1 - (p + g) / 2) * Math.log(L);
    const df = (p - k) * (g - k - 1);
    return { from: k + 1, to: m, L, chi, df, sig: chiSig(chi, df) };
  });
  out.std = can.V.map(v => v.map((c, i) => c * can.sdw[i]));
  // matrice de structure : corrélations intra-groupes combinées
  out.structure = can.V.map(v => { const Sv = mv(covW_sub(C), v); return Sv.map((s, i) => s / Math.sqrt(covW_sub(C)[i][i])); });
  function covW_sub(Cc) { return Cc.W.map(r => r.map(x => x / (Cc.n - Cc.g))); }
  // variables hors modèle (pas à pas) : corrélations avec les fonctions
  if (o.method === 'stepwise' && inModel.length < p0) {
    const notIn = ind.map((_, i) => i).filter(i => !inModel.includes(i));
    const covAll = Cfull.W.map(r => r.map(x => x / dfw));
    out.structureOut = notIn.map(j => ({ name: out.varNames[j], r: can.V.map(v => { let s = 0; inModel.forEach((i, a) => s += covAll[j][i] * v[a]); return s / Math.sqrt(covAll[j][j]); }) }));
  }
  if (o.stats.unstd) out.unstd = { coef: can.V, const: can.consts };

  // scores et barycentres
  const score = x => can.V.map((v, k) => dot(v, x) + can.consts[k]);
  const Z = X.map(score);
  const cent = levels.map((_, k) => { const rr = C.byG[k]; return can.V.map((_, f) => rr.reduce((s, r) => s + Z[r][f], 0) / rr.length); });
  out.centroids = cent;

  // probabilités a priori
  const priors = o.priors === 'size' ? C.nj.map(v => v / C.n) : C.nj.map(() => 1 / g);
  out.priors = { p: priors, nj: C.nj };
  // coefficients de Fisher
  if (o.stats.fisher) {
    const Si = inv(covW_sub(C));
    out.fisher = C.means.map((mu, k) => { const c = mv(Si, mu); return { coef: c, const: -0.5 * dot(c, mu) + Math.log(priors[k]) }; });
  }
  // covariances des scores par groupe (classification groupe par groupe)
  let sep = null;
  if (o.covUse === 'separate') {
    sep = levels.map((_, k) => {
      const rr = C.byG[k], S = zeros(m, m);
      rr.forEach(r => { for (let a = 0; a < m; a++) for (let b = 0; b < m; b++) S[a][b] += (Z[r][a] - cent[k][a]) * (Z[r][b] - cent[k][b]); });
      const Cv = S.map(row => row.map(v => v / (rr.length - 1)));
      const Ci = inv(Cv); const d = det(Cv);
      return Ci && d > 0 ? { Ci, ldet: Math.log(d), cov: Cv } : null;
    });
    if (sep.some(s => !s)) { out.warnings.push('SEP_SINGULAR'); sep = null; }
    else out.sepCov = sep.map(s => s.cov);
  }

  // ----- classement de toutes les observations -----
  const meansAll = ind.map(j => { const v = V[j].values.filter(x => typeof x === 'number' && isFinite(x)); return v.reduce((a, b) => a + b, 0) / v.length; });
  const results = [];
  const idxInValid = new Map(valid.map((c, i) => [c.r, i]));
  cases.forEach(c => {
    let x = c.x;
    if (c.missX) {
      if (!o.replaceMissing) { results.push({ r: c.r, missing: true }); return; }
      x = x.map((v, i) => (typeof v === 'number' && isFinite(v)) ? v : meansAll[i]);
    }
    const xm = inModel.map(i => x[i]);
    const z = score(xm);
    const { post, d2 } = posterior(z, cent, priors, sep);
    const ordk = post.map((_, k) => k).sort((a, b) => post[b] - post[a]);
    const k1 = ordk[0], k2 = ordk[1];
    const actual = (!c.gMiss && !c.gOut) ? levels.indexOf(c.gval) : -1;
    results.push({
      r: c.r, z, post, d2, pred: k1, second: k2, actual: actual >= 0 ? actual : null,
      grouped: actual >= 0 && c.selected && !c.missX, selected: c.selected,
      pD: chiSig(d2[k1], m), ungrouped: actual < 0, replaced: c.missX
    });
  });
  out.cases = results;

  // tableau de classement (observations retenues pour l'analyse = sélectionnées)
  const tab = (rows) => {
    const M = zeros(g + 1, g);
    rows.forEach(rs => { const row = rs.actual == null ? g : rs.actual; M[row][rs.pred]++; });
    return M;
  };
  const selRes = results.filter(rs => !rs.missing && rs.selected && (rs.actual != null || rs.ungrouped));
  const grouped = selRes.filter(rs => rs.actual != null && cases[rs.r].selected && !cases[rs.r].missX);
  out.classif = { orig: tab(selRes.filter(rs => rs.actual != null || rs.ungrouped)), hasUngrouped: selRes.some(rs => rs.ungrouped) };
  out.classif.pct = grouped.filter(rs => rs.pred === rs.actual).length / grouped.length * 100;
  if (sel) {
    const uns = results.filter(rs => !rs.missing && !rs.selected);
    out.classif.unselected = { tab: tab(uns), hasUngrouped: uns.some(rs => rs.ungrouped), pct: (() => { const gg = uns.filter(rs => rs.actual != null); return gg.length ? gg.filter(rs => rs.pred === rs.actual).length / gg.length * 100 : NaN; })() };
  }
  // validation croisée (une observation laissée de côté)
  if (o.loo) {
    const cv = loo(X, gi, g, priors, o.covUse === 'separate');
    cv.forEach((cr, i) => { const rs = results.find(q => q.r === valid[i].r); rs.cv = cr; });
    const M = zeros(g, g); cv.forEach((cr, i) => M[gi[i]][cr.pred]++);
    out.classif.cv = M; out.classif.cvPct = cv.filter((cr, i) => cr.pred === gi[i]).length / cv.length * 100;
    out.classif.cvP = p;
  }
  // traitement du classement
  out.classProc = { processed: nAll, missGroupOrOut: 0, missX: results.filter(rs => rs.missing).length, used: results.filter(rs => !rs.missing).length };

  // test F des distances entre couples (avec le pas à pas)
  if (o.method === 'stepwise' && o.pairwise) {
    const Si = inv(covW_sub(C));
    out.pairwise = [];
    for (let a = 0; a < g; a++) for (let b = 0; b < g; b++) {
      if (a === b) { out.pairwise.push({ a, b }); continue; }
      const d = C.means[a].map((v, i) => v - C.means[b][i]);
      const D2 = dot(d, mv(Si, d));
      const df1 = p, df2 = C.n - g - p + 1;
      const F = (df2 * C.nj[a] * C.nj[b]) / (p * (C.n - g) * (C.nj[a] + C.nj[b])) * D2;
      out.pairwise.push({ a, b, F, sig: fSig(F, df1, df2), df1, df2 });
    }
  }

  // bootstrap
  if (o.boot && o.boot.on && o.method !== 'stepwise') { const bt = bootstrap(X, gi, g, p, can, priors, o, out); if (bt) out.boot = bt; else out.warnings.push('BOOT_FAIL'); }

  // données des graphiques
  out.plot = { Z: results.filter(rs => !rs.missing && rs.actual != null && cases[rs.r].selected && !cases[rs.r].missX).map(rs => ({ z: rs.z, k: rs.actual })), cent, priors, sep: !!sep, sepCov: sep };
  out.classifier = { V: can.V, consts: can.consts, cent, priors, sep };
  return out;
}

// validation croisée : chaque observation classée par les fonctions dérivées des autres
function loo(X, gi, g, priors, separate) {
  const n = X.length, p = X[0].length, res = [];
  const C = core(X, gi, g, p);
  for (let i = 0; i < n; i++) {
    const k0 = gi[i], x = X[i];
    const nj = C.nj.slice(); nj[k0]--;
    const means = C.means.map((mu, k) => k === k0 ? mu.map((v, a) => (v * C.nj[k] - x[a]) / nj[k]) : mu);
    // mise à jour de la SSCP du groupe k0 sans l'observation i
    const dvec = x.map((v, a) => v - C.means[k0][a]);
    const f = C.nj[k0] / (C.nj[k0] - 1);
    const Wk = C.Wg[k0].map((r, a) => r.map((v, b) => v - f * dvec[a] * dvec[b]));
    let lw = [], d2 = [];
    if (separate) {
      for (let k = 0; k < g; k++) {
        const S = (k === k0 ? Wk : C.Wg[k]).map(r => r.map(v => v / (nj[k] - 1)));
        const Si = inv(S), dd = det(S);
        const dx = x.map((v, a) => v - means[k][a]);
        d2[k] = Si ? dot(dx, mv(Si, dx)) : Infinity;
        lw[k] = Math.log(priors[k]) - 0.5 * (dd > 0 ? Math.log(dd) : 0) - 0.5 * d2[k];
      }
    } else {
      const W = C.W.map((r, a) => r.map((v, b) => v - f * dvec[a] * dvec[b]));
      const S = W.map(r => r.map(v => v / (n - 1 - g)));
      const Si = inv(S);
      for (let k = 0; k < g; k++) { const dx = x.map((v, a) => v - means[k][a]); d2[k] = dot(dx, mv(Si, dx)); lw[k] = Math.log(priors[k]) - 0.5 * d2[k]; }
    }
    const mx = Math.max(...lw), w = lw.map(v => Math.exp(v - mx)), s = w.reduce((a, b) => a + b, 0);
    const post = w.map(v => v / s);
    const ord = post.map((_, k) => k).sort((a, b) => post[b] - post[a]);
    res.push({ pred: ord[0], second: ord[1], post, d2, pD: chiSig(d2[ord[0]], p) });
  }
  return res;
}

// méthode pas à pas : critère du lambda de Wilks
function stepwise(C, o, names) {
  const p = C.p, g = C.g, n = C.n;
  const useP = o.crit === 'P';
  const fin = +o.fin, fout = +o.fout, pin = +o.pin, pout = +o.pout;
  const TOL = 0.001;
  const Rw = C.W.map((r, i) => r.map((v, j) => v / Math.sqrt(C.W[i][i] * C.W[j][j])));
  const tolerance = (i, set) => { // tolérance de i par rapport à set
    if (!set.length) return 1;
    const idx = [...set, i], Ri = inv(sub(Rw, idx));
    return Ri ? 1 / Ri[idx.length - 1][idx.length - 1] : 0;
  };
  const steps = [], snapshots = [];
  let model = [];
  const lam = set => wilksSub(C, set);
  const enterF = (i, set) => { const q = set.length, L0 = lam(set), L1 = lam([...set, i]); return { F: ((n - g - q) / (g - 1)) * (L0 / L1 - 1), L1, df1: g - 1, df2: n - g - q }; };
  const removeF = (i, set) => { const q = set.length, rest = set.filter(j => j !== i), L0 = lam(rest), L1 = lam(set); return { F: ((n - g - q + 1) / (g - 1)) * (L0 / L1 - 1), L: L0, df1: g - 1, df2: n - g - q + 1 }; };
  const snap = () => {
    const inV = model.map(i => { const r = removeF(i, model); return { i, tol: tolerance(i, model.filter(j => j !== i)), F: r.F, L: model.length > 1 ? r.L : null, sig: fSig(r.F, r.df1, r.df2) }; });
    const outV = [...Array(p).keys()].filter(i => !model.includes(i)).map(i => {
      const tol = tolerance(i, model);
      let minTol = tol; model.forEach(j => { minTol = Math.min(minTol, tolerance(j, [...model.filter(k => k !== j), i])); });
      const e = enterF(i, model); return { i, tol, minTol, F: e.F, L: e.L1, sig: fSig(e.F, e.df1, e.df2) };
    });
    return { inV, outV };
  };
  snapshots.push(snap());
  const maxSteps = 2 * p;
  for (let s = 0; s < maxSteps; s++) {
    // élimination d'abord
    let acted = false;
    if (model.length > 1 || (model.length === 1 && s > 0)) {
      let worst = null;
      model.forEach(i => { const r = removeF(i, model); const sig = fSig(r.F, r.df1, r.df2); if (!worst || r.F < worst.F) worst = { i, F: r.F, sig }; });
      if (worst && (useP ? worst.sig > pout : worst.F < fout)) {
        model = model.filter(j => j !== worst.i); acted = true;
        steps.push({ type: 'removed', i: worst.i, L: lam(model), q: model.length });
      }
    }
    if (!acted) {
      let best = null;
      [...Array(p).keys()].filter(i => !model.includes(i)).forEach(i => {
        const tol = tolerance(i, model);
        if (tol < TOL) return;
        let ok = true; model.forEach(j => { if (tolerance(j, [...model.filter(k => k !== j), i]) < TOL) ok = false; });
        if (!ok) return;
        const e = enterF(i, model); const sig = fSig(e.F, e.df1, e.df2);
        if (!best || e.F > best.F) best = { i, F: e.F, sig, L: e.L1 };
      });
      if (best && (useP ? best.sig < pin : best.F > fin)) {
        model = [...model, best.i]; acted = true;
        steps.push({ type: 'entered', i: best.i, L: best.L, q: model.length });
      }
    }
    if (!acted) break;
    const last = steps[steps.length - 1];
    last.rao = raoF(last.L, last.q, g, n);
    last.df = [last.q, g - 1, n - g];
    snapshots.push(snap());
  }
  return { steps, snapshots, final: model, names, crit: useP ? { pin, pout } : { fin, fout }, useP };
}

// bootstrap : coefficients canoniques non standardisés et coefficients de Fisher
function bootstrap(X, gi, g, p, can, priors, o, out) {
  const B = Math.max(10, Math.min(5000, +o.boot.n || 1000));
  const rnd = MT(o.boot.set ? (+o.boot.seed || 2000000) : (Date.now() & 0x7fffffff));
  const n = X.length, m = can.m;
  const byG = Array.from({ length: g }, () => []); gi.forEach((k, i) => byG[k].push(i));
  const refStd = can.V.map(v => v.map((c, i) => c * can.sdw[i])); // alignement des signes sur les coefficients standardisés
  const estimates = (Xs, gs) => {
    const C = core(Xs, gs, g, p);
    if (C.nj.some(v => v < 2)) return null;
    let cn; try { cn = canonical(C, refStd); } catch (e) { return null; }
    if (cn.m < m) return null;
    const Si = inv(C.W.map(r => r.map(x => x / (C.n - g)))); if (!Si) return null;
    const pr = o.priors === 'size' ? C.nj.map(v => v / C.n) : priors;
    const fish = C.means.map((mu, k) => { const c = mv(Si, mu); return [...c, -0.5 * dot(c, mu) + Math.log(pr[k])]; });
    const cc = cn.V.map((v, k) => [...v, cn.consts[k]]);
    return { cc, fish };
  };
  const reps = [];
  let fails = 0;
  for (let b = 0; b < B; b++) {
    let idx;
    if (o.boot.strat) { idx = []; byG.forEach(r => { for (let t = 0; t < r.length; t++) idx.push(r[Math.floor(rnd() * r.length)]); }); }
    else { idx = Array.from({ length: n }, () => Math.floor(rnd() * n)); }
    const e = estimates(idx.map(i => X[i]), idx.map(i => gi[i]));
    if (e) reps.push(e); else fails++;
  }
  const level = (+o.boot.level || 95) / 100;
  const orig = estimates(X, gi);
  if (!orig || reps.length < 10) return null;
  const bca = o.boot.bca;
  let jack = null;
  if (bca) { jack = []; for (let i = 0; i < n; i++) { const ii = [...Array(n).keys()].filter(j => j !== i); const e = estimates(ii.map(j => X[j]), ii.map(j => gi[j])); if (e) jack.push(e); } }
  const summarize = (get, est) => {
    const vals = reps.map(get).filter(v => isFinite(v)).sort((a, b) => a - b);
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    const se = Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / (vals.length - 1));
    const q = pr => { const h = (vals.length - 1) * pr, lo = Math.floor(h), hi = Math.ceil(h); return vals[lo] + (vals[hi] - vals[lo]) * (h - lo); };
    let a1 = (1 - level) / 2, a2 = 1 - a1;
    if (bca && jack && jack.length > 2) {
      const prop = vals.filter(v => v < est).length / vals.length;
      const z0 = normInv(Math.min(Math.max(prop, 1e-6), 1 - 1e-6));
      const jv = jack.map(get), jm = jv.reduce((a, b) => a + b, 0) / jv.length;
      const num = jv.reduce((s, v) => s + (jm - v) ** 3, 0), den = 6 * Math.pow(jv.reduce((s, v) => s + (jm - v) ** 2, 0), 1.5);
      const acc = den ? num / den : 0;
      const za = normInv(a1), zb = normInv(a2);
      a1 = normCdf(z0 + (z0 + za) / (1 - acc * (z0 + za)));
      a2 = normCdf(z0 + (z0 + zb) / (1 - acc * (z0 + zb)));
    }
    return { est, bias: mean - est, se, lo: q(a1), hi: q(a2) };
  };
  const cc = orig.cc.map((row, f) => row.map((v, i) => summarize(r => r.cc[f][i], v)));
  const fish = orig.fish.map((row, k) => row.map((v, i) => summarize(r => r.fish[k][i], v)));
  return { B: reps.length, fails, level: level * 100, cc, fish, bca: !!bca, strat: !!o.boot.strat };
}

// ---------- syntaxe SPSS équivalente ----------
function syntax(ds, o) {
  const V = ds.vars, L = [];
  L.push('DISCRIMINANT');
  L.push(`  /GROUPS=${V[o.group].name}(${o.min} ${o.max})`);
  L.push(`  /VARIABLES=${o.indep.map(j => V[j].name).join(' ')}`);
  if (o.selVar != null && o.selVar !== '') L.push(`  /SELECT=${V[o.selVar].name}(${o.selVal})`);
  if (o.method === 'stepwise') {
    L.push('  /ANALYSIS ALL');
    L.push('  /METHOD=WILKS');
    L.push(o.crit === 'P' ? `  /PIN=${o.pin}\n  /POUT=${o.pout}` : `  /FIN=${o.fin}\n  /FOUT=${o.fout}`);
  } else L.push('  /ANALYSIS ALL');
  const sv = []; if (o.save.group) sv.push('CLASS'); if (o.save.scores) sv.push('SCORES'); if (o.save.probs) sv.push('PROBS');
  if (sv.length) L.push(`  /SAVE=${sv.join(' ')}`);
  L.push(`  /PRIORS ${o.priors === 'size' ? 'SIZE' : 'EQUAL'}`);
  const hs = [];
  if (o.stats.means) hs.push('MEAN', 'STDDEV'); if (o.stats.anova) hs.push('UNIVF'); if (o.stats.box) hs.push('BOXM');
  if (o.stats.fisher) hs.push('COEFF'); if (o.stats.unstd) hs.push('RAW');
  if (o.stats.wcorr) hs.push('CORR'); if (o.stats.wcov) hs.push('COV'); if (o.stats.gcov) hs.push('GCOV'); if (o.stats.tcov) hs.push('TCOV');
  if (o.method === 'stepwise' && o.pairwise) hs.push('FPAIR');
  if (o.summary) hs.push('TABLE'); if (o.loo) hs.push('CROSSVALID');
  L.push(`  /STATISTICS=${[...new Set(hs)].join(' ')}`);
  if (o.method === 'stepwise') L.push(`  /HISTORY${o.summaryOfSteps === false ? '=NONE' : ''}`);
  const pl = []; if (o.plots.combined) pl.push('COMBINED'); if (o.plots.separate) pl.push('SEPARATE'); if (o.plots.territorial) pl.push('MAP'); if (o.casewise) pl.push('CASES' + (o.limit ? `(${o.limit})` : ''));
  if (pl.length) L.push(`  /PLOT=${pl.join(' ')}`);
  L.push(`  /CLASSIFY=${o.replaceMissing ? 'MEANSUB' : 'NONMISSING'} ${o.covUse === 'separate' ? 'SEPARATE' : 'POOLED'}.`);
  return L.join('\n');
}

  // aide
  helpHtml: [
`<h3>Utiliser l'application</h3>
<ol>
<li><b>Données</b> : ouvrez un fichier .sav, .xlsx, .xls, .ods ou .csv, ou saisissez vos données. Chaque ligne est une observation, chaque colonne une variable.</li>
<li><b>Analyse</b> : choisissez la variable de regroupement et sa plage (minimum et maximum), cochez les variables indépendantes, puis réglez les boutons Statistiques, Méthode, Classifier, Enregistrer et Bootstrap comme dans SPSS.</li>
<li>Appuyez sur <b>OK</b> : les tableaux apparaissent dans <b>Résultats</b>, avec les mêmes intitulés que SPSS.</li>
<li>Dans <b>Résultats</b>, saisissez votre nom et votre prénom, puis exportez en Word ou en PDF : le fichier porte votre nom et peut être envoyé à l'enseignant.</li>
</ol>
<h3>Ordre de lecture des résultats</h3>
<table class="t"><tr><th>Tableau</th><th>Question</th><th>Règle</th></tr>
<tr><td>Test de Box</td><td>Covariances égales ?</td><td>p &gt; 0,05 : respectée</td></tr>
<tr><td>Lambda de Wilks</td><td>Fonctions significatives ?</td><td>p &lt; 0,05 : la fonction compte</td></tr>
<tr><td>Valeurs propres</td><td>Poids des fonctions ?</td><td>% de variance, Rc²</td></tr>
<tr><td>Coefficients standardisés</td><td>Variables qui pèsent ?</td><td>|coefficient| &gt; 0,30</td></tr>

<h3>Hors connexion</h3>

<ol>
<li><b>Data</b>: open a .sav, .xlsx, .xls, .ods or .csv file, or enter your data. Each row is a case, each column a variable.</li>
<li><b>Analysis</b>: choose the grouping variable and its range (minimum and maximum), tick the independent variables, then set the Statistics, Method, Classify, Save and Bootstrap buttons as in SPSS.</li>
<li>Tap <b>OK</b>: the tables appear in <b>Output</b>, with the same titles as SPSS.</li>
<li>In <b>Output</b>, enter your last and first name, then export to Word or PDF: the file carries your name and can be sent to the teacher.</li>

async function pdf(report, o) {
  const PW = 595.28, PH = 841.89, MX = 34, MY = 36, CW = PW - 2 * MX, CH = PH - 2 * MY - 14;
  const blocks = [...report.querySelectorAll('.rep-head, .run > h2, .part')];
  const scale = 2;
  const pages = [[]]; let y = 0;
  const pxW = report.clientWidth;
  for (const bl of blocks) {
    const cv = await html2canvas(bl, { scale, backgroundColor: '#ffffff', logging: false, useCORS: true, windowWidth: pxW });
    const k = CW / cv.width; // points par pixel du canevas
    let hPt = cv.height * k, srcY = 0;
    if (y > 0 && hPt > CH - y && hPt <= CH) { pages.push([]); y = 0; }
    while (hPt > 0) {
      const room = CH - y;
      const take = Math.min(hPt, room);
      const sh = Math.round(take / k);
      const piece = document.createElement('canvas'); piece.width = cv.width; piece.height = Math.max(1, Math.min(sh, cv.height - srcY));
      piece.getContext('2d').fillStyle = '#fff'; piece.getContext('2d').fillRect(0, 0, piece.width, piece.height);
      piece.getContext('2d').drawImage(cv, 0, srcY, cv.width, piece.height, 0, 0, cv.width, piece.height);
      pages[pages.length - 1].push({ jpg: piece.toDataURL('image/jpeg', 0.88), w: piece.width, h: piece.height, x: MX, y: MY + y, wPt: CW, hPt: piece.height * k });
      y += piece.height * k + 8; srcY += piece.height; hPt -= take;
      if (hPt > 0.5) { pages.push([]); y = 0; }
    }
  }
  // écriture du fichier PDF
  const objs = []; const add = s => { objs.push(s); return objs.length; };
  const parts = []; let len = 0; const offsets = [];
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  // réservation : 1 catalogue, 2 pages
  const pageIds = [];
  const objects = []; // {id, build: () => [strings/bytes]}
  let nextId = 3;
  const fontId = nextId++;
  objects.push({ id: fontId, body: ['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'] });
  pages.forEach((pg, pi) => {
    const imgIds = pg.map(() => nextId++);
    const contentId = nextId++, pageId = nextId++;
    pageIds.push(pageId);
    pg.forEach((im, j) => {
      const bytes = b64ToBytes(im.jpg);
      objects.push({ id: imgIds[j], body: [`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`, bytes, '\nendstream'] });
    });
    let cs = pg.map((im, j) => `q ${im.wPt.toFixed(2)} 0 0 ${im.hPt.toFixed(2)} ${im.x.toFixed(2)} ${(PH - im.y - im.hPt).toFixed(2)} cm /Im${j} Do Q`).join('\n');
    cs += `\nBT /F1 8 Tf 0.45 0.5 0.55 rg ${MX} 18 Td (${pdfStr(o.footer)}) Tj ET\nBT /F1 8 Tf ${PW - MX - 30} 18 Td (${pi + 1}/${pages.length}) Tj ET`;
    const csb = enc.encode(cs);
    objects.push({ id: contentId, body: [`<< /Length ${csb.length} >>\nstream\n`, csb, '\nendstream'] });
    objects.push({ id: pageId, body: [`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 ${fontId} 0 R >> /XObject << ${imgIds.map((id, j) => `/Im${j} ${id} 0 R`).join(' ')} >> >> /Contents ${contentId} 0 R >>`] });
  });
  objects.push({ id: 1, body: ['<< /Type /Catalog /Pages 2 0 R >>'] });
  objects.push({ id: 2, body: [`<< /Type /Pages /Kids [${pageIds.map(i => i + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`] });
  const infoId = nextId++;
  objects.push({ id: infoId, body: [`<< /Title (${pdfStr(o.title)}) /Author (${pdfStr(o.author)}) /Producer (Analyse discriminante) >>`] });
  objects.sort((a, b) => a.id - b.id);
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const offs = new Array(nextId).fill(0);
  objects.forEach(ob => { offs[ob.id] = len; push(`${ob.id} 0 obj\n`); ob.body.forEach(push); push('\nendobj\n'); });
  const xref = len;
  let xr = `xref\n0 ${nextId}\n0000000000 65535 f \n`;
  for (let i = 1; i < nextId; i++) xr += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(xr + `trailer\n<< /Size ${nextId} /Root 1 0 R /Info ${infoId} 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}

async function pickSave(name) {

  try { return await window.showSaveFilePicker({ suggestedName: name, types: [{ description: ext.toUpperCase(), accept: { [MIME[ext]]: ['.' + ext] } }] }); }

// préparation : indices, recodage automatique d'une variable de regroupement chaîne
function prepare() {
  const o = S.opts, ds = S.ds;
  if (!o.group) { toast(t('errNoGroup'), true); return null; }
  let gIdx = ds.vars.findIndex(v => v.name === o.group);
  let dsr = ds, min = o.min, max = o.max;
  if (ds.vars[gIdx].type === 'str') {
    const v = ds.vars[gIdx], u = [...new Set(v.values.filter(x => x !== ''))].sort((a, b) => a.localeCompare(b));
    const labels = {}; u.forEach((x, i) => labels[i + 1] = x);
    const nv = { name: v.name, label: v.label, type: 'num', labels, values: v.values.map(x => x === '' ? NaN : u.indexOf(x) + 1) };
    dsr = { ...ds, vars: ds.vars.map((x, i) => i === gIdx ? nv : x) };
    min = 1; max = u.length;
  }
  if (!(isFinite(min) && isFinite(max) && Number.isInteger(+min) && Number.isInteger(+max) && +min < +max)) { toast(t('errRange'), true); return null; }
  if (!o.indep.length) { toast(t('errNoIndep'), true); return null; }
  const idx = n => ds.vars.findIndex(v => v.name === n);
  return {
    ds: dsr, o: {
      ...o, group: gIdx, min: +min, max: +max, indep: o.indep.map(idx), selVar: o.selVar ? idx(o.selVar) : null, selVal: o.selVal,
      loo: o.loo, boot: { ...o.boot, on: o.boot.on && o.method !== 'stepwise' }
    }
  };
}

function saveVars(res, prep) {
  const o = prep.o, sv = S.opts.save; if (!sv.group && !sv.scores && !sv.probs) return [];
  const ds = S.ds; const names = new Set(ds.vars.map(v => v.name)); const out = [];
  ds.saved = (ds.saved || 0) + 1;
  let suffix = 1; const free = base => { let k = suffix; while ([...Array(res.m > res.g ? res.m : res.g).keys()].some(i => names.has(`${base}${i + 1}_${k}`))) k++; return k; };
  const mk = (name, label, vals, labels) => { const v = { name, label, type: 'num', labels: labels || {}, values: vals }; ds.vars.push(v); names.add(name); out.push(name); };
  const byRow = new Map(res.cases.map(c => [c.r, c]));
  const col = f => Array.from({ length: ds.n }, (_, r) => { const c = byRow.get(r); return c && !c.missing ? f(c) : NaN; });
  const gv = prep.ds.vars[o.group];
  if (sv.group) {
    let k = 1; while (names.has('Dis_' + k)) k++;
    const lab = {}; res.groups.forEach(g => { if (g.label != null) lab[g.value] = g.label; });
    mk('Dis_' + k, ({ fr: 'Groupe prévu pour analyse ', en: 'Predicted group for analysis ', ar: 'المجموعة المتوقعة للتحليل ' })[S.lang] + S.runCount, col(c => res.groups[c.pred].value), lab);
  }
  if (sv.scores) {
    const k = free('Dis');
    for (let f = 0; f < res.m; f++) mk(`Dis${f + 1}_${k}`, ({ fr: `Scores discriminants de la fonction ${f + 1} pour analyse `, en: `Discriminant scores from function ${f + 1} for analysis `, ar: `الدرجات التمييزية للدالة ${f + 1} للتحليل ` })[S.lang] + S.runCount, col(c => c.z[f]));
    suffix = k + 1;
  }
